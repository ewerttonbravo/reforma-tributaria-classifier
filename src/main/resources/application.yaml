spring:
  kafka:
    bootstrap-servers: localhost:9092
    admin:
      operation-timeout: 10s
    producer:
      acks: all
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      properties:
        enable.idempotence: true
        # Fail a send to an unreachable broker in 10 s instead of the default 60 s.
        max.block.ms: 10000
        spring.json.add.type.headers: false
    consumer:
      group-id: tax-classifier
      # A product published before the service first starts is still classified.
      auto-offset-reset: earliest
      # Each record waits on the AI; a poll of 500 could outlast max.poll.interval.ms and be classified again.
      max-poll-records: 1
      # Hands a record that is not a product's JSON to the error handler, which skips it, instead of failing every poll.
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
        spring.json.value.default.type: com.ebravo.taxclassifier.adapter.kafka.ProductMessage
        spring.json.use.type.headers: false
    listener:
      # Commits each record once the listener returns, after its result is sent; a crash reprocesses only that record.
      ack-mode: record
  datasource:
    url: jdbc:postgresql://localhost:5432/tax_classifier
    # Local demo credentials, the same as compose.yaml; SPRING_DATASOURCE_USERNAME and _PASSWORD override them.
    username: tax_classifier
    password: tax_classifier
  http:
    clients:
      # Only the calculator's RestClient uses them; a calculator that hangs fails as unavailable instead of holding the consumer.
      connect-timeout: 2s
      read-timeout: 10s
  sql:
    init:
      # Creates the suggestions table on start if it is missing (schema.sql).
      mode: always
calculator:
  base-url: http://localhost:8080/api/calculadora
  # Where the operation takes place (IBGE code); the products CSV has no location.
  municipality: 3550308
  uf: SP
  # Percent rates for taxable events from 2027 on, which the calculator requires; the official example's values.
  nominal-rates:
    cbs: 8.8
    ibs-state: 0.05
    ibs-municipal: 0.05
classification:
  confidence-threshold: 0.80
  # Waits of 1, 2, 4, 8, 16 and 30 s (61 s in all), past the 19 to 26 s the calculator was measured to take to start.
  retry:
    initial-interval: 1s
    multiplier: 2
    max-interval: 30s
    max-retries: 6
ai:
  base-url: https://api.anthropic.com
  timeout: 60s
